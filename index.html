<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFD84D">
<title>50嵐 團購點餐</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{--blue:#2f7fc1;--blue-d:#1e5f96;--yellow:#FFD84D;--line:#06C755}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-tap-highlight-color:transparent}
  body.lock{overflow:hidden}
  .no-scrollbar{scrollbar-width:none}.no-scrollbar::-webkit-scrollbar{display:none}
  .card{background:#fff;border-radius:16px;border:1px solid rgba(15,23,42,.05);box-shadow:0 1px 2px rgba(15,23,42,.04),0 6px 16px rgba(15,23,42,.05)}
  .field{width:100%;border:1.5px solid #e2e8f0;border-radius:12px;padding:.65rem .8rem;font-size:16px;background:#f8fafc;outline:none;transition:.15s}
  .field:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(47,127,193,.15)}
  .field.err{border-color:#ef4444;background:#fef2f2}
  .tab{flex:none;padding:.4rem .9rem;border-radius:999px;font-size:14px;font-weight:600;background:#fff;color:#475569;border:1px solid #e2e8f0;transition:.15s}
  .tab.on{background:var(--blue);color:#fff;border-color:var(--blue)}
  .item{transition:transform .1s}.item:active{transform:scale(.985)}
  .tag{font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;line-height:1.5}
  .tag-rec{background:#fee2e2;color:#dc2626}
  .tag-cold{background:#e0f2fe;color:#0369a1}
  .price{background:#f1f5f9;color:#475569;padding:2px 8px;border-radius:8px;font-weight:600}
  .add-btn{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:#eaf3fb;color:var(--blue);font-size:22px;font-weight:600;line-height:1}
  .badge{position:absolute;top:-8px;right:-8px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:#ef4444;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid #fff}
  .chips{display:flex;flex-wrap:wrap;gap:.5rem}
  .chip{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:64px;min-height:46px;padding:.4rem .9rem;border-radius:12px;border:1.5px solid #e2e8f0;background:#fff;font-weight:600;font-size:14px;color:#334155;transition:.12s}
  .chip small{font-size:11px;font-weight:500;opacity:.65}
  .chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .chip:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
  #overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
  #overlay.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:42rem;max-height:90vh;max-height:90dvh;display:flex;flex-direction:column;background:#fff;border-radius:22px 22px 0 0;z-index:50;transform:translateY(105%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s;box-shadow:0 -10px 40px rgba(15,23,42,.18)}
  .sheet.open{transform:none;visibility:visible;transition:transform .25s ease}
  .sheet-handle{width:40px;height:4px;border-radius:4px;background:#cbd5e1;margin:8px auto 0}
  .sheet-body{overflow-y:auto;padding:1rem 1.25rem;flex:1;-webkit-overflow-scrolling:touch}
  .sheet-foot{padding:.75rem 1.25rem calc(.75rem + env(safe-area-inset-bottom));border-top:1px solid #f1f5f9;background:#fff}
  .stepper{display:flex;align-items:center;background:#f1f5f9;border-radius:12px}
  .stepper button{width:40px;height:44px;font-size:20px;font-weight:700;color:#334155}
  .stepper span{min-width:28px;text-align:center;font-weight:700}
  .btn{display:flex;align-items:center;justify-content:center;gap:.4rem;border-radius:14px;font-weight:700;padding:.8rem 1rem;transition:.12s}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--blue);color:#fff}
  .btn-line{background:var(--line);color:#fff}
  .btn-ghost{background:#f1f5f9;color:#334155}
  #toast{position:fixed;left:50%;top:1rem;transform:translate(-50%,-150%);background:#0f172a;color:#fff;padding:.6rem 1rem;border-radius:12px;font-size:14px;z-index:70;transition:transform .25s;max-width:90vw}
  #toast.show{transform:translate(-50%,0)}
</style>
</head>
<body class="bg-[#faf8f3] text-slate-800 antialiased">
<div id="errbar" style="display:none;position:fixed;left:8px;right:8px;top:8px;z-index:100;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:12px;padding:10px 12px;font-size:12px;word-break:break-all"></div>
<script>
window.showErr=function(m){var b=document.getElementById('errbar');if(!b)return;b.style.display='block';b.textContent='載入錯誤：'+m;};
window.addEventListener('error',function(e){window.showErr(e.message+(e.lineno?'（第'+e.lineno+'行）':''));});
</script>
<noscript><div style="padding:16px;color:#b91c1c;background:#fef2f2">此頁面需要開啟 JavaScript 才能使用。</div></noscript>

<header class="bg-[#FFD84D]">
  <div class="max-w-2xl mx-auto px-4 pt-6 pb-12">
    <p class="text-xs font-semibold tracking-wide text-sky-900/60">PART OF YOUR DAILY.</p>
    <h1 class="text-2xl font-extrabold text-sky-900 mt-1">🧋 50嵐 團購點餐</h1>
    <p class="text-sm text-sky-900/70 mt-1">選飲料、甜度、冰量、加料，一鍵產生 LINE 訂單訊息</p>
  </div>
</header>

<div class="max-w-2xl mx-auto px-4 -mt-7">
  <section class="card p-4">
    <h2 class="text-sm font-bold text-slate-500 mb-3">訂購人資訊</h2>
    <div class="grid grid-cols-2 gap-3">
      <label class="block">
        <span class="text-xs font-semibold text-slate-500">團體編號 <b class="text-red-500">*</b></span>
        <input id="group" class="field mt-1" type="text" maxlength="20" placeholder="例如 A12" autocomplete="off">
      </label>
      <label class="block">
        <span class="text-xs font-semibold text-slate-500">訂購人姓名 <b class="text-red-500">*</b></span>
        <input id="name" class="field mt-1" type="text" maxlength="20" placeholder="你的名字" autocomplete="name">
      </label>
    </div>
  </section>
</div>

<nav class="sticky top-0 z-20 mt-4 bg-[#faf8f3]/95 backdrop-blur border-b border-black/5">
  <div class="max-w-2xl mx-auto px-4 pt-3 pb-3 space-y-2.5">
    <div class="relative">
      <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">🔍</span>
      <input id="search" class="field !pl-9 !py-2.5" type="search" placeholder="搜尋飲料，例如：珍珠、烏龍" autocomplete="off">
    </div>
    <div id="tabs" class="flex gap-2 overflow-x-auto no-scrollbar -mx-4 px-4"></div>
  </div>
</nav>

<main id="menu" class="max-w-2xl mx-auto px-4 pt-4 pb-4"><div id="boot" class="text-center text-slate-400 py-16 text-sm leading-relaxed">⏳ 菜單載入中…<br>若一直停在這裡，代表程式沒有執行，請截圖給我</div></main>

<div class="max-w-2xl mx-auto px-4 pb-36 text-xs text-slate-400 space-y-1">
  <p><span class="tag tag-rec">推</span> 店家推薦　<span class="tag tag-cold">❄ 僅冷飲</span> 不提供溫熱</p>
  <p>價格依 2026/03 菜單整理。加料：茶類 +$10、奶茶／鮮奶茶類免費、布丁一律 +$15；塑膠袋必購 +$2。</p>
</div>

<!-- 底部訂單列 -->
<div class="fixed bottom-0 inset-x-0 z-30 px-4 pt-8 pb-[max(.75rem,env(safe-area-inset-bottom))] pointer-events-none" style="background:linear-gradient(to top,#faf8f3 55%,rgba(250,248,243,0))">
  <button data-act="openCart" class="pointer-events-auto mx-auto max-w-2xl w-full flex items-center justify-between rounded-2xl px-5 py-3.5 text-white font-bold shadow-lg" style="background:var(--blue)">
    <span id="barLabel">🛒 尚未選購</span>
    <span id="barTotal">$0</span>
  </button>
</div>

<div id="overlay" data-act="close"></div>

<!-- 飲料選項 -->
<section id="itemSheet" class="sheet" role="dialog" aria-modal="true" aria-label="選擇飲料規格">
  <div class="sheet-handle"></div>
  <div class="flex items-start justify-between px-5 pt-3">
    <div>
      <h2 id="sheetTitle" class="text-xl font-extrabold"></h2>
      <p id="sheetSub" class="text-sm text-slate-500 mt-0.5"></p>
    </div>
    <button data-act="close" class="w-9 h-9 rounded-full bg-slate-100 text-slate-500 font-bold" aria-label="關閉">✕</button>
  </div>
  <div class="sheet-body" id="sheetBody">
    <div id="opts"></div>
    <div>
      <h3 class="text-sm font-bold text-slate-500 mb-2">備註 <span class="font-normal text-slate-400">（選填）</span></h3>
      <input id="note" class="field" type="text" maxlength="30" placeholder="例如：吸管不要、分開裝">
    </div>
  </div>
  <div class="sheet-foot flex items-center gap-3">
    <div class="stepper">
      <button data-act="dDec" aria-label="減少">−</button>
      <span id="dQty">1</span>
      <button data-act="dInc" aria-label="增加">＋</button>
    </div>
    <button data-act="add" class="btn btn-primary flex-1">加入訂單 <span id="dPrice">$0</span></button>
  </div>
</section>

<!-- 訂單 -->
<section id="cartSheet" class="sheet" role="dialog" aria-modal="true" aria-label="我的訂單">
  <div class="sheet-handle"></div>
  <div class="flex items-center justify-between px-5 pt-3">
    <h2 class="text-xl font-extrabold">我的訂單</h2>
    <button data-act="close" class="w-9 h-9 rounded-full bg-slate-100 text-slate-500 font-bold" aria-label="關閉">✕</button>
  </div>
  <div class="sheet-body" id="cartBody"></div>
  <div class="sheet-foot" id="cartFoot">
    <div class="flex items-center justify-between mb-3">
      <span class="text-slate-500 font-semibold">總金額</span>
      <span id="cartTotal" class="text-2xl font-extrabold text-sky-700">$0</span>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <button data-act="copy" class="btn btn-ghost">📋 複製訊息</button>
      <button data-act="line" class="btn btn-line">傳送到 LINE</button>
    </div>
  </div>
</section>

<div id="toast" role="status"></div>

<script>
/* ===== 設定 ===== */
// 加料價格規則（老闆提供）：
//   純茶類（非奶類）加料 +$10；奶茶、鮮奶茶（拿鐵）類加料 $0；布丁一律 +$15
//   tea = 非奶類飲料的加價、milk = 奶類飲料的加價
const TOPPINGS = [
  {id:'bubble', name:'波霸', tea:10, milk:0},
  {id:'mini',   name:'珍珠', tea:10, milk:0},
  {id:'oat',    name:'燕麥', tea:10, milk:0},
  {id:'coconut',name:'椰果', tea:10, milk:0},
  {id:'pudding',name:'布丁', tea:15, milk:15},
];
// 塑膠袋：強制購買。預設每筆訂單 1 個 $2；若要改成每杯 1 個，把 BAG_PER_CUP 改成 true
const BAG_PRICE = 2;
const BAG_PER_CUP = false;
const SUGAR = [{n:'無糖',p:'0%'},{n:'微糖',p:'25%'},{n:'半糖',p:'50%'},{n:'少糖',p:'70%'},{n:'全糖',p:'100%'}];
const ICE   = [{n:'溫熱',p:'',hot:true},{n:'去冰',p:'0%'},{n:'微冰',p:'40%'},{n:'少冰',p:'70%'},{n:'正常冰',p:'100%'}];

/* ===== 菜單（m=中杯、l=大杯；旗標 r=推薦、c=僅冷飲、m=奶類）；葡萄柚系列暫無，已移除 ===== */
const I = (name,m,l,f='') => ({name,m,l,rec:f.includes('r'),cold:f.includes('c'),milk:f.includes('m')});
const MENU = [
  {id:'tea', name:'找好茶', en:'Flavored Tea', items:[
    I('茉莉綠茶',30,35), I('阿薩姆紅茶',30,35), I('四季春青茶',30,35,'r'), I('黃金烏龍',30,35),
    I('珍波椰青茶',35,45,'r'), I('波霸紅茶',35,45), I('波霸綠茶',35,45),
    I('燕麥紅茶',35,45), I('燕麥綠茶',35,45), I('微檸檬紅茶',35,45), I('微檸檬青茶',35,45),
    I('麵茶紅茶',40,55), I('麵茶烏龍',40,55), I('檸檬綠茶',40,55), I('梅の綠茶',40,55),
    I('8冰綠茶',40,55,'r'), I('情人茶',40,55,'r'),
    I('多多綠茶',40,55,'c'), I('蜂蜜綠茶',40,55,'c'),
    I('旺來紅茶',40,55,'r'), I('旺來青茶',40,55,'r'), I('柚子紅茶',40,55), I('柚子烏龍',40,55)
  ]},
  {id:'milk', name:'找奶茶', en:'Classic Milk Tea', milk:true, items:[
    I('奶茶',40,55,'r'), I('奶綠',40,55), I('烏龍奶',40,55,'r'), I('椰果奶茶',40,55),
    I('珍珠奶茶',40,55), I('波霸奶茶',40,55,'r'), I('燕麥奶茶',40,55,'r'),
    I('蜂蜜奶茶',50,65,'c'), I('布丁奶茶',50,65),
    I('紅茶瑪奇朵',40,55,'r'), I('青茶瑪奇朵',40,55), I('阿華田',40,55)
  ]},
  {id:'latte', name:'找拿鐵', en:'Tea Latte', milk:true, items:[
    I('紅茶拿鐵',50,65,'r'), I('綠茶拿鐵',50,65), I('重焙烏龍拿鐵',50,65,'r'),
    I('珍珠紅茶拿鐵',50,65,'r'), I('波霸紅茶拿鐵',50,65), I('燕麥紅茶拿鐵',50,65,'r'),
    I('波霸綠茶拿鐵',50,65), I('燕麥重焙烏龍拿鐵',50,65,'r'), I('布丁紅茶拿鐵',55,75),
    I('阿華田拿鐵',50,65), I('燕麥阿華田拿鐵',50,65), I('麵茶紅茶拿鐵',55,75)
  ]},
  {id:'fresh', name:'找新鮮', en:'Fresh Juice', items:[
    I('蜜茶',40,55,'c'), I('8冰茶',40,55), I('柚子茶',40,55), I('檸檬汁',50,65),
    I('金桔檸檬',50,65,'r'), I('檸檬梅汁',50,65,'r'), I('檸檬多多',55,75,'c')
  ]},
  {id:'ice', name:'找冰淇淋', en:'Ice Cream', items:[
    I('冰淇淋紅茶',40,55,'c'), I('芒果青',40,55,'cr'), I('荔枝烏龍',40,55,'cr'),
    I('冰淇淋奶茶',50,65,'cm'), I('冰淇淋紅茶拿鐵',55,75,'cm'), I('冰淇淋麵茶紅茶拿鐵',60,80,'cm')
  ]},
];
const ITEMS = {};
MENU.forEach(c => c.items.forEach((it,i) => { it.id = c.id+'-'+i; it.milk = it.milk || !!c.milk; ITEMS[it.id] = it; }));

/* ===== 工具 ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
const topName = id => (TOPPINGS.find(t => t.id===id)||{}).name || id;
const topPrice = (id, item) => { const t = TOPPINGS.find(t => t.id===id); return t ? (item && item.milk ? t.milk : t.tea) : 0; };

/* ===== 狀態 ===== */
let cart = store.get('dk_cart', []);
if (!Array.isArray(cart)) cart = [];
let activeCat = 'all';
let draft = null;

const groupEl = $('#group'), nameEl = $('#name'), searchEl = $('#search');
groupEl.value = store.get('dk_group','');
nameEl.value  = store.get('dk_name','');
groupEl.addEventListener('input', () => { store.set('dk_group', groupEl.value.trim()); groupEl.classList.remove('err'); refreshCartIfOpen(); });
nameEl.addEventListener('input',  () => { store.set('dk_name',  nameEl.value.trim());  nameEl.classList.remove('err');  refreshCartIfOpen(); });
searchEl.addEventListener('input', renderMenu);

const totalCups  = () => cart.reduce((s,c) => s + c.qty, 0);
const subtotal   = () => cart.reduce((s,c) => s + c.unit * c.qty, 0);
const bagFee     = () => !cart.length ? 0 : (BAG_PER_CUP ? BAG_PRICE * totalCups() : BAG_PRICE);
const totalPrice = () => subtotal() + bagFee();
const cartCount  = id => cart.filter(c => c.itemId===id).reduce((s,c) => s + c.qty, 0);

/* ===== 分類 & 菜單 ===== */
function renderTabs(){
  const tabs = [{id:'all',name:'全部'},{id:'rec',name:'🔥 推薦'}, ...MENU.map(c => ({id:c.id,name:c.name}))];
  $('#tabs').innerHTML = tabs.map(t => `<button class="tab ${t.id===activeCat?'on':''}" data-act="tab" data-cat="${t.id}">${t.name}</button>`).join('');
}

function cardHtml(it){
  const n = cartCount(it.id);
  return `<button type="button" data-item="${it.id}" class="card item w-full text-left p-3.5 flex items-center gap-3">
    <div class="min-w-0 flex-1">
      <div class="flex items-center gap-1.5 flex-wrap">
        <span class="font-semibold text-[15px]">${esc(it.name)}</span>
        ${it.rec ? '<span class="tag tag-rec">推</span>' : ''}
        ${it.cold ? '<span class="tag tag-cold">❄ 僅冷飲</span>' : ''}
      </div>
      <div class="mt-1.5 flex gap-1.5 text-xs"><span class="price">M $${it.m}</span><span class="price">L $${it.l}</span></div>
    </div>
    <div class="relative shrink-0">${n ? `<span class="badge">${n}</span>` : ''}<span class="add-btn">＋</span></div>
  </button>`;
}

function renderMenu(){
  const q = searchEl.value.trim();
  let html = '';
  for (const cat of MENU){
    const items = cat.items.filter(it =>
      (activeCat==='all' || activeCat===cat.id || (activeCat==='rec' && it.rec)) &&
      (!q || it.name.includes(q)));
    if (!items.length) continue;
    html += `<section class="mb-6">
      <h2 class="flex items-baseline gap-2 mb-2.5 px-1"><span class="text-lg font-extrabold text-sky-900">${cat.name}</span><span class="text-xs font-semibold text-slate-400 uppercase">${cat.en}</span></h2>
      <div class="grid gap-2.5 sm:grid-cols-2">${items.map(cardHtml).join('')}</div>
    </section>`;
  }
  $('#menu').innerHTML = html || `<div class="text-center text-slate-400 py-16">找不到符合的飲料 🥲</div>`;
}

/* ===== 彈出面板 ===== */
function openSheet(el){
  $('#overlay').classList.add('show'); el.classList.add('open'); document.body.classList.add('lock');
}
function closeSheets(){
  document.querySelectorAll('.sheet.open').forEach(s => s.classList.remove('open'));
  $('#overlay').classList.remove('show'); document.body.classList.remove('lock');
}
document.addEventListener('keydown', e => { if (e.key==='Escape') closeSheets(); });

/* ===== 飲料選項 ===== */
const unitPrice = d => (d.size==='M' ? d.item.m : d.item.l) + [...d.tops].reduce((s,id) => s + topPrice(id, d.item), 0);

function chip(group, value, label, sub, on, disabled){
  return `<button type="button" class="chip ${on?'on':''}" data-pick="${group}" data-v="${value}" ${disabled?'disabled':''}>${label}${sub?`<small>${sub}</small>`:''}</button>`;
}
function section(title, inner){
  return `<div class="mb-5"><h3 class="text-sm font-bold text-slate-500 mb-2">${title}</h3>${inner}</div>`;
}
function renderOpts(){
  const d = draft, it = d.item;
  const size  = section('容量', `<div class="chips">${chip('size','M','中杯 M','$'+it.m,d.size==='M')}${chip('size','L','大杯 L','$'+it.l,d.size==='L')}</div>`);
  const sugar = section('甜度', `<div class="chips">${SUGAR.map(s => chip('sugar',s.n,s.n,s.p,d.sugar===s.n)).join('')}</div>`);
  const ice   = section('冰量' + (it.cold ? ' <span class="font-normal text-sky-600">❄ 此品項不提供溫熱</span>' : ''),
    `<div class="chips">${ICE.map(s => chip('ice',s.n,s.n,s.p,d.ice===s.n, it.cold && s.hot)).join('')}</div>`);
  const tp = t => it.milk ? t.milk : t.tea;
  const tops  = section('加料 <span class="font-normal text-slate-400">（可複選）</span> <span class="font-normal text-sky-600">' + (it.milk ? '奶類加料免費，布丁 +$15' : '茶類加料 +$10，布丁 +$15') + '</span>',
    `<div class="chips">${TOPPINGS.map(t => chip('top',t.id,t.name,tp(t) ? '+$'+tp(t) : '免費',d.tops.has(t.id))).join('')}</div>`);
  $('#opts').innerHTML = size + sugar + ice + tops;
  $('#dQty').textContent = d.qty;
  $('#dPrice').textContent = '$' + unitPrice(d) * d.qty;
}
function openItem(id){
  const it = ITEMS[id]; if (!it) return;
  draft = {item:it, size:'M', sugar:'全糖', ice:'正常冰', tops:new Set(), qty:1};
  $('#sheetTitle').textContent = it.name;
  $('#sheetSub').textContent = `中杯 $${it.m}　／　大杯 $${it.l}`;
  $('#note').value = '';
  renderOpts();
  $('#sheetBody').scrollTop = 0;
  openSheet($('#itemSheet'));
}
function addToCart(){
  const d = draft; if (!d) return;
  const tops = [...d.tops].sort();
  const note = $('#note').value.trim();
  const key = [d.item.id, d.size, d.sugar, d.ice, tops.join(','), note].join('|');
  const ex = cart.find(c => c.key===key);
  if (ex) ex.qty = Math.min(99, ex.qty + d.qty);
  else cart.push({key, itemId:d.item.id, name:d.item.name, size:d.size, sugar:d.sugar, ice:d.ice, tops, note, qty:d.qty, unit:unitPrice(d)});
  closeSheets();
  toast(`已加入：${d.item.name} ×${d.qty}`);
  draft = null;
  updateAll();
}

/* ===== 訂單 ===== */
function buildMessage(){
  const g = groupEl.value.trim(), n = nameEl.value.trim();
  const L = [];
  L.push('🧋 50嵐 團購訂單');
  L.push('團體編號：' + (g || '（未填）'));
  L.push('訂購人：' + (n || '（未填）'));
  L.push('────────────');
  cart.forEach((c,i) => {
    const parts = [`${c.sugar}`, `${c.ice}`];
    if (c.tops.length) parts.push('加' + c.tops.map(topName).join('、'));
    if (c.note) parts.push('備註:' + c.note);
    L.push(`${i+1}. ${c.name}(${c.size}) ${parts.join('／')} ×${c.qty}　$${c.unit*c.qty}`);
  });
  L.push('────────────');
  L.push(`共 ${totalCups()} 杯　飲料小計：$${subtotal()}`);
  L.push(`塑膠袋（必購）：$${bagFee()}`);
  L.push(`總金額：$${totalPrice()}`);
  return L.join('\n');
}

function lineHtml(c,i){
  const opts = [c.sugar, c.ice, ...(c.tops.length ? ['加' + c.tops.map(topName).join('、')] : [])].join('／');
  return `<div class="flex items-start gap-3 py-3 border-b border-slate-100 last:border-0">
    <div class="min-w-0 flex-1">
      <div class="font-semibold">${esc(c.name)} <span class="text-xs font-bold text-sky-700 bg-sky-50 rounded px-1.5 py-0.5">${c.size}</span></div>
      <div class="text-xs text-slate-500 mt-0.5">${esc(opts)}${c.note ? '｜備註：' + esc(c.note) : ''}</div>
      <div class="text-sm font-bold text-sky-700 mt-1">$${c.unit*c.qty} <span class="text-xs font-medium text-slate-400">（$${c.unit}／杯）</span></div>
    </div>
    <div class="flex flex-col items-end gap-2">
      <div class="stepper">
        <button data-act="cDec" data-i="${i}" aria-label="減少">−</button><span>${c.qty}</span><button data-act="cInc" data-i="${i}" aria-label="增加">＋</button>
      </div>
      <button data-act="cDel" data-i="${i}" class="text-xs text-red-500 font-semibold">移除</button>
    </div>
  </div>`;
}

let clearArmed = false, clearTimer;
function renderCart(){
  const body = $('#cartBody');
  if (!cart.length){
    body.innerHTML = `<div class="py-14 text-center text-slate-400"><div class="text-4xl mb-2">🧋</div>還沒有飲料，回去挑一杯吧</div>`;
    $('#cartFoot').style.display = 'none';
    return;
  }
  $('#cartFoot').style.display = '';
  const g = groupEl.value.trim(), n = nameEl.value.trim();
  const warn = (!g || !n)
    ? `<button data-act="editInfo" class="w-full text-left text-sm font-semibold text-amber-700 bg-amber-50 rounded-xl px-3 py-2.5 mb-3">⚠️ 請先填寫${!g?'團體編號':''}${!g&&!n?'與':''}${!n?'訂購人姓名':''}（點此前往）</button>`
    : `<div class="text-sm text-slate-500 mb-3">團體編號 <b class="text-slate-800">${esc(g)}</b>　訂購人 <b class="text-slate-800">${esc(n)}</b></div>`;
  body.innerHTML = `${warn}
    <div>${cart.map(lineHtml).join('')}
      <div class="flex items-center justify-between py-3 text-sm"><span class="text-slate-600">🛍️ 塑膠袋 <span class="text-xs text-slate-400">（必購）</span></span><span class="font-bold text-sky-700">$${bagFee()}</span></div>
    </div>
    <div class="flex items-center justify-between mt-4 mb-2">
      <h3 class="text-sm font-bold text-slate-500">LINE 訊息預覽</h3>
      <button data-act="clear" class="text-xs font-semibold text-red-500">${clearArmed ? '再按一次確認清空' : '清空訂單'}</button>
    </div>
    <textarea id="msg" readonly rows="${Math.min(14, cart.length + 8)}" class="field !text-sm leading-relaxed">${esc(buildMessage())}</textarea>`;
  $('#cartTotal').textContent = '$' + totalPrice();
}
function refreshCartIfOpen(){ if ($('#cartSheet').classList.contains('open')) renderCart(); }

function renderBar(){
  const c = totalCups();
  $('#barLabel').textContent = c ? `🛒 ${c} 杯｜查看訂單` : '🛒 尚未選購';
  $('#barTotal').textContent = '$' + totalPrice();
}
function updateAll(){
  store.set('dk_cart', cart);
  renderMenu(); renderBar(); refreshCartIfOpen();
}

/* ===== 傳送 ===== */
function ensureInfo(){
  const g = groupEl.value.trim(), n = nameEl.value.trim();
  if (g && n) return true;
  closeSheets();
  (!g ? groupEl : nameEl).classList.add('err');
  if (!g) groupEl.classList.add('err'); if (!n) nameEl.classList.add('err');
  window.scrollTo({top:0, behavior:'smooth'});
  setTimeout(() => (!g ? groupEl : nameEl).focus({preventScroll:true}), 350);
  toast('請先填寫團體編號與姓名');
  return false;
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.cssText = 'position:fixed;opacity:0;top:0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length);
    let ok = false; try{ ok = document.execCommand('copy'); }catch(_){}
    ta.remove(); return ok;
  }
}

/* ===== 事件 ===== */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-item],[data-pick],[data-act]');
  if (!el) return;

  if (el.dataset.item){ openItem(el.dataset.item); return; }

  if (el.dataset.pick){
    const k = el.dataset.pick, v = el.dataset.v;
    if (k==='size' || k==='sugar' || k==='ice') draft[k] = v;
    else if (k==='top'){ draft.tops.has(v) ? draft.tops.delete(v) : draft.tops.add(v); }
    renderOpts(); return;
  }

  const i = +el.dataset.i;
  switch (el.dataset.act){
    case 'close': closeSheets(); break;
    case 'tab': activeCat = el.dataset.cat; renderTabs(); renderMenu(); window.scrollTo({top:0}); break;
    case 'dDec': draft.qty = Math.max(1, draft.qty - 1); renderOpts(); break;
    case 'dInc': draft.qty = Math.min(99, draft.qty + 1); renderOpts(); break;
    case 'add': addToCart(); break;
    case 'openCart': renderCart(); openSheet($('#cartSheet')); break;
    case 'cInc': cart[i].qty = Math.min(99, cart[i].qty + 1); updateAll(); break;
    case 'cDec': cart[i].qty = Math.max(1, cart[i].qty - 1); updateAll(); break;
    case 'cDel': cart.splice(i, 1); updateAll(); break;
    case 'clear':
      if (!clearArmed){
        clearArmed = true; renderCart();
        clearTimer = setTimeout(() => { clearArmed = false; refreshCartIfOpen(); }, 3000);
      } else {
        clearTimeout(clearTimer); clearArmed = false; cart = []; updateAll(); toast('已清空訂單');
      }
      break;
    case 'editInfo': ensureInfo(); break;
    case 'copy':
      if (!ensureInfo()) break;
      toast(await copyText(buildMessage()) ? '已複製訊息 ✓' : '複製失敗，請長按訊息框手動複製');
      break;
    case 'line':
      if (!ensureInfo()) break;
      window.open('https://line.me/R/msg/text/?' + encodeURIComponent(buildMessage()), '_blank', 'noopener');
      break;
  }
});

/* ===== 初始化 ===== */
[renderTabs, renderMenu, renderBar].forEach(function(f){
  try{ f(); }catch(err){ window.showErr(f.name + ' 失敗：' + err.message); }
});
</script>
</body>
</html>
